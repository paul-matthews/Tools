# The actions layer: hold Tab, press a key.
#
# Every key sends ⌃⌥⇧ and itself; Alfred turns that chord into the matching
# script in scripts/. After editing this file:
#
#     ./actions-gen.py -c ACTIONS.md
#
# and re-run launcher-patch.py if you added or moved a key.

# Apps — focus an application, leave its windows alone.
# The bundle identifier is what gets activated; find one with:
#     osascript -e 'id of app "Obsidian"'
# Chrome web apps are real bundles with generated identifiers, which is why
# Calendar and Chat look the way they do.
apps:
  Chrome:
    key: C
    bundle: com.google.chrome
  iTerm2:
    key: T
    bundle: com.googlecode.iterm2
  VSCodium:
    key: V
    bundle: com.vscodium
  Obsidian:
    key: O
    bundle: md.obsidian
  Calendar:
    key: A
    bundle: com.google.chrome.app.kjbdgfilnfhdoflbpgamdcdgpehopbep
  Chat:
    key: W
    bundle: com.google.chrome.app.mdpkiolbdkhdjpekfbkbmhigcaggjagi
  Gemini:
    key: G
    bundle: com.google.geminimacos
  Drive:
    key: D
    bundle: com.google.drivefs
  Finder:
    key: F
    bundle: com.apple.finder
  1Password:
    key: P
    bundle: com.1password.1password

# Modes — a sequence of steps, run in order. The LAST step decides where the
# focus ends up, so put the thing you want to type into last.
#
# Step kinds:
#
#   - layout: Meeting          run a saved Moom layout by name. Use this when
#                              several windows of one app must be placed —
#                              `place` only ever reaches the frontmost window.
#   - place: Obsidian          activate an app (named above) and put it in a
#     region: Below camera     region from regions.py, by its title
#   - focus: Chrome            activate an app, move nothing
#   - shortcut: Deep Work      run a shortcut from Shortcuts.app — this is how
#                              Focus modes and anything else scriptable get in
#   - url: https://example.com open a link in the default browser
modes:
  Meeting:
    key: "1"
    steps:
      - layout: Meeting
      - focus: Obsidian

  Presenting:
    key: "2"
    steps:
      # Record a "Presenting" layout in Moom, then this is all it needs.
      - layout: Presenting

  Notes:
    key: "3"
    steps:
      - place: Chrome
        region: Left third
      - place: Obsidian
        region: Right two-thirds

  Terminals:
    key: "4"
    steps:
      # Several iTerm2 windows is exactly the case a saved layout handles and
      # a sequence of moves cannot.
      - layout: Terminals
